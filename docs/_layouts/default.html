<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ page.title }} | {{ site.title }}</title>
    <link rel="stylesheet" href="https://unpkg.com/@primer/css@^20.2.4/dist/primer.css">
    <meta name="description" content="{{ page.description | default: site.description }}">
    {% seo %}
</head>
<body>
    <div class="Header">
        <div class="Header-item">
            <a href="/" class="Header-link f4 d-flex flex-items-center">
                🤖 {{ site.title }}
            </a>
        </div>
        <div class="Header-item Header-item--full">
            <div class="Header-search">
                <nav class="UnderlineNav" aria-label="Main">
                    <div class="UnderlineNav-body">
                        <a class="UnderlineNav-item" href="/" aria-current="{% if page.url == '/' %}page{% endif %}">Home</a>
                        <a class="UnderlineNav-item" href="/setup" aria-current="{% if page.url == '/setup' %}page{% endif %}">Setup</a>
                        <a class="UnderlineNav-item" href="/usage" aria-current="{% if page.url == '/usage' %}page{% endif %}">Usage</a>
                        <a class="UnderlineNav-item" href="/troubleshooting" aria-current="{% if page.url == '/troubleshooting' %}page{% endif %}">Troubleshooting</a>
                    </div>
                </nav>
            </div>
        </div>
        <div class="Header-item">
            <a href="https://github.com/{{ site.github_username }}/{{ site.repository }}" class="btn btn-outline">
                <svg class="octicon octicon-mark-github v-align-middle" height="16" viewBox="0 0 16 16" version="1.1" width="16" aria-hidden="true">
                    <path fill-rule="evenodd" d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0016 8c0-4.42-3.58-8-8-8z"></path>
                </svg>
                GitHub
            </a>
        </div>
    </div>

    <div class="container-xl px-3 px-md-6 my-4">
        <div class="col-12 col-md-9 mx-auto">
            {{ content }}
        </div>
    </div>

    <footer class="footer bg-gray-light py-4 mt-6">
        <div class="container-xl px-3 px-md-6">
            <div class="d-flex flex-justify-between flex-items-center">
                <div class="d-flex flex-items-center text-gray">
                    <span class="mr-2">© 2025 Intelligent Business Rule Management</span>
                </div>
                <div class="d-flex flex-items-center">
                    <a href="https://github.com/{{ site.github_username }}/{{ site.repository }}" class="text-gray mr-3">
                        View on GitHub
                    </a>
                    <a href="https://github.com/{{ site.github_username }}/{{ site.repository }}/issues" class="text-gray">
                        Report Issue
                    </a>
                </div>
            </div>
        </div>
    </footer>
</body>
</html>
